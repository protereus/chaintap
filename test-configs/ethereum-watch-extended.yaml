chain: ethereum
database:
  type: sqlite
  path: ./extended-test-ethereum.db

contracts:
  # UNI Token - moderate volume, good for extended testing
  - address: "0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984"
    name: "UNI Token"
    events:
      - Transfer
      - Approval
    from_block: null  # Start from current block

  # USDC - high volume stablecoin for stress testing
  - address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    name: "USDC"
    events:
      - Transfer
    from_block: null

providers:
  - url: "${ALCHEMY_URL}"
    priority: 1
  - url: "https://eth.llamarpc.com"
    priority: 2
  - url: "https://rpc.ankr.com/eth"
    priority: 3

options:
  batch_size: 10
  confirmations: 12
  poll_interval: 15000  # 15 seconds
  max_retries: 5
